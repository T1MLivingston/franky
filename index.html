<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Franky's Wetland Word Search</title>
<link rel="icon" href="frany_head_smile.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="pond-bg" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="mascot" aria-hidden="true">
        <img src="franky_right.png" alt="" class="franky-img header-franky-img" />
      </div>
      <div class="title-block">
        <h1 id="title-main">Wetland Inhabitant<span id="title-sub">Word Search</span></h1>
        <p class="subtitle" id="subtitle-text">Search for the types of animals found in wetlands, with Franky the Frog!</p>
      </div>
    </div>
  </header>

  <main>
    <div class="controls-bar">
      <div class="control-group">
        <label for="bank-select">Word bank</label>
        <select id="bank-select"></select>
      </div>
      <div class="control-group">
        <span class="control-label">Difficulty</span>
        <div class="difficulty-buttons" id="difficulty-buttons" role="group" aria-label="Difficulty">
          <button data-difficulty="easy" type="button">Easy</button>
          <button data-difficulty="medium" type="button">Medium</button>
          <button data-difficulty="hard" type="button">Hard</button>
        </div>
        <button id="reset-btn" class="btn-reset" type="button">New puzzle</button>
      </div>
      <div class="timer-badge">
        <span aria-hidden="true">⏱</span>
        <span id="timer-display">00:00</span>
      </div>
    </div>

    <div class="layout">
      <aside class="word-panel" aria-label="Word list">
        <img id="mascot-feedback" src="frany_head_smile.png" alt="" class="mascot-feedback" />
        <h2>Words to find</h2>
        <ul id="word-list" class="word-list"></ul>
        <div class="progress">
          <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
          <span id="progress-label">0 / 0 found</span>
        </div>
      </aside>

      <section class="puzzle-panel" aria-label="Word search grid">
        <div class="panel-head">
          <h2>Find the hidden words</h2>
        </div>
        <div id="grid" class="grid" role="grid" aria-label="Word search puzzle"></div>
      </section>
    </div>
  </main>

  <div id="win-banner" class="win-banner hidden" role="status">
    <div class="win-card">
      <div class="win-mascot" aria-hidden="true">
        <img src="frany_head_smile.png" alt="" class="franky-img win-franky-img" />
      </div>
      <h2>Ribbit-ing job!</h2>
      <p id="win-message">You found every word.</p>
      <button id="play-again-btn" class="btn-reset" type="button">Play again</button>
    </div>
  </div>

  <footer class="site-footer">
    <p>Made for Franky the Frog &middot; wetland word search</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
